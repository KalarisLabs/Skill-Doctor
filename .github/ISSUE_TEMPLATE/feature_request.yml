name: "Feature Request"
description: "Suggest an idea, CLI improvement, or platform enhancement for Skill Doctor"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please note that detector contributions must adhere to the 11 SDTM-v1 threat classes.
        For rule proposals, please use the Rule Proposal template instead.
  - type: textarea
    id: problem
    attributes:
      label: "Problem / Motivation"
      description: "What limitation or use case does this feature address?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe how you envision this working within Skill Doctor's deterministic architecture."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
