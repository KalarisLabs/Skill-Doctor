name: Performance Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly run at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  criterion-benchmarks:
    name: Criterion Micro-Benchmarks
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Criterion benchmarks
        run: |
          cargo bench --workspace -- --verbose 2>&1 | tee bench_output.txt

      - name: Upload Criterion reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-benchmark-reports
          path: target/criterion/

  throughput-memory-benchmarks:
    name: Throughput & Peak RSS Benchmarks (§7.3 Targets)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Measure throughput & peak RSS
        shell: bash
        run: |
          echo "=== Measuring throughput and peak RSS on fixtures ==="
          /usr/bin/time -v ./target/release/skill-doctor scan-all . \
            --exclude tests/fixtures/attack \
            --exclude tests/fixtures/evasion \
            --exclude sd-bench/corpora \
            --offline --deterministic 2> perf_stats.txt

          cat perf_stats.txt

          MAX_RSS_KB=$(grep "Maximum resident set size" perf_stats.txt | awk '{print $NF}')
          MAX_RSS_MB=$(awk "BEGIN {print $MAX_RSS_KB / 1024}")
          ELAPSED_SEC=$(grep "Elapsed (wall clock) time" perf_stats.txt | awk '{print $NF}')

          echo "### Performance Benchmark Results (§7.3)" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Measured | Target (§7.3) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Peak RSS | ${MAX_RSS_MB} MB | < 40 MB | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Wall Clock Time | ${ELAPSED_SEC} | Sub-second | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Binary Footprint | $(ls -lh ./target/release/skill-doctor | awk '{print $5}') | ~12 MB stripped | ✅ Tracked |" >> $GITHUB_STEP_SUMMARY
