name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  version-sync:
    name: version-sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify version synchronization & claim integrity
        run: |
          CARGO_VER=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          PKG_VER=$(grep -m1 '"version":' package.json | cut -d'"' -f4)
          echo "Cargo.toml version: $CARGO_VER"
          echo "package.json version: $PKG_VER"

          if [ "$CARGO_VER" != "$PKG_VER" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VER) does not match package.json ($PKG_VER)"
            exit 1
          fi

          if ! grep -q "## \[$CARGO_VER\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md missing release section for [$CARGO_VER]"
            exit 1
          fi

          if ! grep -q "https://github.com/KalarisLabs/Skill-Doctor/releases/tag/v${CARGO_VER}" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md missing release link for https://github.com/KalarisLabs/Skill-Doctor/releases/tag/v${CARGO_VER}"
            exit 1
          fi

          MSRV=$(grep -m1 '^rust-version = ' Cargo.toml | cut -d'"' -f2)
          if ! grep -q "Requires Rust ${MSRV}+ (MSRV)" README.md; then
            echo "ERROR: README.md does not match Cargo.toml MSRV ($MSRV)"
            exit 1
          fi

          if [ ! -f "action.yml" ]; then
            echo "ERROR: action.yml missing at repository root"
            exit 1
          fi

          if ! grep -q "default: \"${CARGO_VER}\"" action.yml; then
            echo "ERROR: action.yml default version does not match Cargo.toml version ($CARGO_VER)"
            exit 1
          fi

          if ! grep -q "uses: KalarisLabs/Skill-Doctor@v${CARGO_VER}" README.md; then
            echo "ERROR: README.md does not reference canonical action uses: KalarisLabs/Skill-Doctor@v${CARGO_VER}"
            exit 1
          fi

          if ! grep -q '"LICENSE"' package.json || ! grep -q '"README.md"' package.json; then
            echo "ERROR: package.json files array must include LICENSE and README.md"
            exit 1
          fi

          if ! grep -Fq "cargo install --path crates/skill-doctor-cli --locked --features mcp" README.md; then
            echo "ERROR: README.md does not contain exact source install command with --features mcp"
            exit 1
          fi

          echo "Running dependency claim verification against cargo metadata..."
          python3 scripts/check-deps.py

          echo "Version sync & claim integrity verified: $CARGO_VER (MSRV: $MSRV)"

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks secrets detection
        run: |
          GITLEAKS_VERSION="8.24.0"
          GITLEAKS_SHA256="cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          gitleaks detect --source . --verbose --redact

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: cargo-deny check (advisories, licenses, bans, unknown git)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

      - name: Invariant shell grep gate
        run: bash scripts/invariants.sh

      - name: Semgrep architectural invariants
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v0.58.0
        with:
          config: .semgrep/skill-doctor-invariants.yml

  check:
    name: check-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fast workspace check
        run: cargo check --workspace --all-targets --locked

  msrv:
    name: msrv-check
    needs: [check]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.93.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup MSRV Rust toolchain (1.93.0)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.0"

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify MSRV compilation floor
        run: cargo +1.93.0 check --workspace --all-targets --locked

  lint-and-unit:
    name: lint-and-unit
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy linter (workspace default)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: "Clippy linter (feature: mcp)"
        run: cargo clippy -p skill-doctor --no-default-features --features mcp --all-targets --locked -- -D warnings

      - name: "Clippy linter (feature: sandbox)"
        run: cargo clippy -p skill-doctor --no-default-features --features sandbox --all-targets --locked -- -D warnings

      - name: "Clippy linter (feature: intel)"
        run: cargo clippy -p skill-doctor --no-default-features --features intel --all-targets --locked -- -D warnings

      - name: Clippy linter (all-features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Unit & Integration tests
        env:
          SD_L3_REQUIRE_INTERPRETER: "1"
        run: cargo test --workspace --locked

      - name: Invariant grep (no mandatory LLM SDKs)
        run: |
          echo "Verifying architectural invariant: zero direct model dependencies on default path..."
          if grep -r -i -E "openai|anthropic" crates/skill-doctor-cli/src crates/skill-doctor-core/src; then
            echo "ERROR: Direct model SDK/vendor references detected on default path."
            exit 1
          fi
          echo "Invariant verified: Pure deterministic core."

  os-cli:
    name: os-cli
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary
        run: cargo build --release --locked

      - name: CLI smoke — --help & --version
        run: |
          BIN="./target/release/skill-doctor"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="./target/release/skill-doctor.exe"
          fi
          $BIN --help
          CLI_VER=$($BIN --version | awk '{print $2}')
          CARGO_VER=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "CLI reported version: $CLI_VER, expected: $CARGO_VER"
          if [ "$CLI_VER" != "$CARGO_VER" ]; then
            echo "ERROR: CLI version ($CLI_VER) does not match Cargo.toml ($CARGO_VER)"
            exit 1
          fi

      - name: CLI smoke — benign scan (exit 0)
        run: |
          BIN="./target/release/skill-doctor"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="./target/release/skill-doctor.exe"
          fi
          $BIN scan tests/fixtures/benign/hello-skill --fail-on HIGH --offline --deterministic

      - name: CLI smoke — attack SD-02 scan (exit 2)
        run: |
          BIN="./target/release/skill-doctor"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="./target/release/skill-doctor.exe"
          fi
          set +e
          $BIN scan tests/fixtures/attack/SD-02/malicious-skill --fail-on HIGH --offline --deterministic
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 2 ]; then
            echo "Expected exit code 2 for attack fixture, got $EXIT_CODE"
            exit 1
          fi
          echo "Attack fixture correctly exited with code 2."

  dogfood-self-scan:
    name: dogfood-self-scan
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Dogfood self-scan
        run: |
          ./target/release/skill-doctor scan-all . \
            --exclude tests/fixtures/attack \
            --exclude tests/fixtures/evasion \
            --exclude sd-bench/corpora \
            --output sarif \
            --fail-on HIGH \
            --deterministic --offline > skill-doctor.sarif
          echo "Dogfood self-scan passed."

      - name: Verify attack detection invariant (exit 2)
        run: |
          set +e
          ./target/release/skill-doctor scan tests/fixtures/attack/SD-02/malicious-skill --fail-on HIGH --offline --deterministic
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 2 ]; then
            echo "Expected exit code 2 for attack fixture, got $EXIT_CODE"
            exit 1
          fi
          echo "Attack detection verified: correctly exited with code 2."

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: skill-doctor.sarif

  determinism:
    name: determinism
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Determinism verification (identical SHA-256)
        run: |
          ./target/release/skill-doctor scan tests/fixtures/benign/hello-skill \
            --output json --deterministic --offline > run1.json
          ./target/release/skill-doctor scan tests/fixtures/benign/hello-skill \
            --output json --deterministic --offline > run2.json
          sha1=$(sha256sum run1.json | cut -d' ' -f1)
          sha2=$(sha256sum run2.json | cut -d' ' -f1)
          echo "Run 1 SHA-256: $sha1"
          echo "Run 2 SHA-256: $sha2"
          if [ "$sha1" != "$sha2" ]; then
            echo "FAIL: Non-deterministic output detected."
            exit 1
          fi
          echo "Determinism verified: Outputs are bit-identical."

  packaging-gate:
    name: packaging-gate
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary with MCP feature
        run: cargo build --release --locked -p skill-doctor --features mcp


      - name: Verify local binary installer flow (npm wrapper)
        run: |
          # 1. Clean bin/ directory
          rm -rf bin/skill-doctor bin/skill-doctor.exe
          
          # 2. Test download-binary.js detects local target/release binary
          node scripts/download-binary.js
          test -f bin/skill-doctor
          
          # 3. Test bin/skill-doctor.js wrapper execution
          node bin/skill-doctor.js --version
          node bin/skill-doctor.js scan examples/hello-skill

          # 4. Verify no stray files in bin/
          test ! -f bin/LICENSE
          test ! -f bin/README.md

      - name: Verify npm package packing and tarball contents
        run: |
          TARBALL=$(npm pack)
          echo "Packed tarball: $TARBALL"
          tar -tzf "$TARBALL" | grep "package/LICENSE"
          tar -tzf "$TARBALL" | grep "package/README.md"
          tar -tzf "$TARBALL" | grep "package/bin/skill-doctor.js"
          tar -tzf "$TARBALL" | grep "package/scripts/download-binary.js"

      - name: Verify offline / source install skip flag
        run: |
          rm -rf bin/skill-doctor
          SKILL_DOCTOR_SKIP_DOWNLOAD=1 node scripts/download-binary.js
          echo "Offline skip flag verified cleanly."

  docs-smoke:
    name: docs-smoke
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary
        run: cargo build -p skill-doctor --release --locked --features mcp

      - name: Smoke test README install and quick-start commands
        run: |
          set -e
          export PATH="$(pwd)/target/release:$PATH"

          echo "1. Testing README Install command (npx wrapper simulation)..."
          node bin/skill-doctor.js scan ./examples/hello-skill

          echo "2. Testing README Install from source with cargo..."
          cargo install --path crates/skill-doctor-cli --locked --features mcp
          which skill-doctor

          echo "3. Testing skill-doctor scan ./examples/hello-skill..."
          skill-doctor scan ./examples/hello-skill

          echo "4. Testing skill-doctor scan-all . --output sarif..."
          skill-doctor scan-all . --output sarif || [ $? -eq 2 ]

          echo "5. Testing skill-doctor diff ./examples/hello-skill --baseline report.json..."
          skill-doctor scan ./examples/hello-skill --output json > report.json
          skill-doctor diff ./examples/hello-skill --baseline report.json

          echo "6. Testing skill-doctor watch ./examples/hello-skill..."
          timeout 10s skill-doctor watch ./examples/hello-skill || [ $? -eq 124 ]

          echo "7. Testing skill-doctor mcp..."
          echo '' | timeout 10s skill-doctor mcp || [ $? -eq 124 ]

          echo "8. Testing skill-doctor explain SD-04..."
          skill-doctor explain SD-04

          echo "9. Testing CI gate command block..."
          skill-doctor scan-all . \
            --output sarif \
            --fail-on HIGH \
            --fail-under-coverage 0.8 \
            --deterministic \
            --offline || [ $? -eq 2 ]

          echo "10. Testing Build from source command..."
          cargo run -p skill-doctor --locked --features mcp -- scan ./examples/hello-skill

          echo "All README Install and quick-start commands executed successfully with exit 0."
