name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-unit:
    name: lint-and-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit & Integration tests
        run: cargo test --workspace --locked

      - name: Invariant grep (no mandatory LLM SDKs)
        shell: bash
        run: |
          echo "Verifying architectural invariant: zero direct model dependencies on default path..."
          if grep -r -i -E "openai|anthropic" crates/skill-doctor-cli/src crates/skill-doctor-core/src; then
            echo "ERROR: Direct model SDK/vendor references detected on default path."
            exit 1
          fi
          echo "Invariant verified: Pure deterministic core."

  os-cli:
    name: os-cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: CLI smoke — --help & --version
        shell: bash
        run: |
          BIN="./target/release/skill-doctor"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="./target/release/skill-doctor.exe"
          fi
          $BIN --help
          $BIN --version

      - name: CLI smoke — benign scan (exit 0)
        shell: bash
        run: |
          BIN="./target/release/skill-doctor"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="./target/release/skill-doctor.exe"
          fi
          $BIN scan tests/fixtures/benign/hello-skill --fail-on HIGH --offline --deterministic

      - name: CLI smoke — attack SD-02 scan (exit 2)
        shell: bash
        run: |
          BIN="./target/release/skill-doctor"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="./target/release/skill-doctor.exe"
          fi
          set +e
          $BIN scan tests/fixtures/attack/SD-02/malicious-skill --fail-on HIGH --offline --deterministic
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 2 ]; then
            echo "Expected exit code 2 for attack fixture, got $EXIT_CODE"
            exit 1
          fi
          echo "Attack fixture correctly exited with code 2."

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks secrets detection
        shell: bash
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --verbose --redact

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo-deny check (advisories, licenses, bans, unknown git)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Invariant shell grep gate
        run: bash scripts/invariants.sh

      - name: Semgrep architectural invariants
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/skill-doctor-invariants.yml

  dogfood-self-scan:
    name: dogfood-self-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Dogfood self-scan
        shell: bash
        run: |
          ./target/release/skill-doctor scan-all . \
            --exclude tests/fixtures/attack \
            --exclude tests/fixtures/evasion \
            --exclude sd-bench/corpora \
            --output sarif \
            --fail-on HIGH \
            --deterministic --offline > skill-doctor.sarif
          echo "Dogfood self-scan passed."

      - name: Verify attack detection invariant (exit 2)
        shell: bash
        run: |
          set +e
          ./target/release/skill-doctor scan tests/fixtures/attack/SD-02/malicious-skill --fail-on HIGH --offline --deterministic
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 2 ]; then
            echo "Expected exit code 2 for attack fixture, got $EXIT_CODE"
            exit 1
          fi
          echo "Attack detection verified: correctly exited with code 2."

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skill-doctor.sarif

  determinism:
    name: determinism
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Determinism verification (identical SHA-256)
        shell: bash
        run: |
          ./target/release/skill-doctor scan tests/fixtures/benign/hello-skill \
            --output json --deterministic --offline > run1.json
          ./target/release/skill-doctor scan tests/fixtures/benign/hello-skill \
            --output json --deterministic --offline > run2.json
          sha1=$(sha256sum run1.json | cut -d' ' -f1)
          sha2=$(sha256sum run2.json | cut -d' ' -f1)
          echo "Run 1 SHA-256: $sha1"
          echo "Run 2 SHA-256: $sha2"
          if [ "$sha1" != "$sha2" ]; then
            echo "FAIL: Non-deterministic output detected."
            exit 1
          fi
          echo "Determinism verified: Outputs are bit-identical."

  docs-smoke:
    name: docs-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test README quick-start commands
        shell: bash
        run: |
          set -e
          export PATH="$(pwd)/target/release:$PATH"

          echo "1. Testing skill-doctor scan ./examples/hello-skill..."
          skill-doctor scan ./examples/hello-skill

          echo "2. Testing skill-doctor scan-all . --output sarif..."
          skill-doctor scan-all ./examples --output sarif

          echo "3. Testing skill-doctor diff ./examples/hello-skill --baseline report.json..."
          skill-doctor scan ./examples/hello-skill --output json > report.json
          skill-doctor diff ./examples/hello-skill --baseline report.json

          echo "4. Testing skill-doctor watch ./examples/hello-skill..."
          timeout 2 skill-doctor watch ./examples/hello-skill || [ $? -eq 124 ] || [ $? -eq 0 ]

          echo "5. Testing skill-doctor mcp..."
          timeout 2 skill-doctor mcp </dev/null || [ $? -eq 124 ] || [ $? -eq 0 ]

          echo "6. Testing skill-doctor explain SD-04..."
          skill-doctor explain SD-04

          echo "7. Testing CI gate command block..."
          skill-doctor scan-all ./examples \
            --output sarif \
            --fail-on HIGH \
            --fail-under-coverage 0.8 \
            --deterministic \
            --offline

          echo "8. Testing Build from source command..."
          cargo run -p skill-doctor -- scan ./examples/hello-skill

          echo "All README quick-start commands executed successfully with exit 0."
