name: HyperExecute Benchmark Grid

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Number of parallel shards/nodes"
        required: false
        default: "4"
  schedule:
    # Run nightly benchmark at 02:00 UTC
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  hyperexecute-benchmark:
    name: Run Distributed Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download and Run LambdaTest HyperExecute CLI
        shell: bash
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '4' }}
        run: |
          if [ -z "$LT_USERNAME" ] || [ -z "$LT_ACCESS_KEY" ]; then
            echo "::error::LT_USERNAME and LT_ACCESS_KEY secrets must be configured in GitHub Secrets to execute HyperExecute benchmarks."
            exit 1
          fi

          echo "Downloading LambdaTest HyperExecute CLI..."
          curl -sSf https://downloads.lambdatest.com/hyperexecute/linux/hyperexecute -o hyperexecute
          chmod +x hyperexecute

          echo "Triggering HyperExecute distributed benchmark execution..."
          ./hyperexecute --user "$LT_USERNAME" --key "$LT_ACCESS_KEY" --config hyperexecute.yaml --concurrency "$CONCURRENCY"

      - name: Upload Artifacts Summary
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: hyperexecute-benchmarks
          path: |
            sd-bench/results-raw/
            hyperexecute.log
          if-no-files-found: ignore
