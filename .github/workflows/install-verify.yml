name: install-verify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to test (e.g. 0.1.0)"
        required: false
        default: "0.1.0"

defaults:
  run:
    shell: bash

jobs:
  verify-download-and-install:
    name: Verify Real Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Create synthetic test fixture (no repo checkout)
        run: |
          mkdir -p test-skill
          cat << 'EOF' > test-skill/SKILL.md
          ---
          name: hello-world
          description: A benign skill for installation verification
          ---
          # Hello World
          This is a clean, minimal test skill for post-release verification.
          EOF

      - name: Test npx real download & SHA-256 verification
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0"
          fi

          echo "Testing npx @kalarislabs/skill-doctor@${VERSION} scan ./test-skill..."
          # Run npx wrapper and capture stdout/stderr
          # Must NOT find any local binary shortcut and MUST execute SHA-256 checksum verification
          OUTPUT=$(npx --yes "@kalarislabs/skill-doctor@${VERSION}" scan ./test-skill 2>&1)
          echo "$OUTPUT"

          # Assert that real download path executed and verified SHA-256
          if echo "$OUTPUT" | grep -Fq "using existing local binary"; then
            echo "FAILED: Local binary shortcut was incorrectly executed instead of real download!"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -Fq "skill-doctor: verifying SHA-256 digest..."; then
            echo "FAILED: Real download path did not log SHA-256 verification!"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -Fq "skill-doctor: checksum OK"; then
            echo "FAILED: Expected 'skill-doctor: checksum OK' log line!"
            exit 1
          fi

      - name: Test npm global install and CLI binary execution
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0"
          fi

          echo "Testing npm install -g @kalarislabs/skill-doctor@${VERSION}..."
          npm install -g "@kalarislabs/skill-doctor@${VERSION}"
          skill-doctor --version
          skill-doctor scan ./test-skill

      - name: Test Composite Action from published release tag
        uses: KalarisLabs/Skill-Doctor@v0.1.0
        with:
          path: ./test-skill
          mode: scan
          fail-on: HIGH
          output: sarif
          sarif-file: post-release-test.sarif

      - name: Verify SARIF output was generated
        run: |
          if [ ! -s post-release-test.sarif ]; then
            echo "FAILED: Expected post-release-test.sarif to be generated by action"
            exit 1
          fi
          echo "post-release-test.sarif verified successfully."
