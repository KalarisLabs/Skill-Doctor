name: install-verify

on:
  schedule:
    # Run weekly on Mondays at 04:00 UTC
    - cron: '0 4 * * 1'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to test (e.g. 0.1.0)"
        required: false
        default: "0.1.0"

defaults:
  run:
    shell: bash

jobs:
  verify-download-and-install:
    name: Verify Real Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve target version
        id: resolve-version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Testing version: $VERSION"

      - name: Test npx real download & checksum verification (exit 0 on benign fixture)
        run: |
          echo "Testing npx @security.kalarislabs/skill-doctor@${VERSION} scan ./examples/hello-skill..."
          OUTPUT=$(npx --yes "@security.kalarislabs/skill-doctor@${VERSION}" scan ./examples/hello-skill 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "FAILED: Expected exit code 0 on ./examples/hello-skill, got $EXIT_CODE"
            exit 1
          fi

          if echo "$OUTPUT" | grep -Fq "using existing local binary"; then
            echo "FAILED: Local binary shortcut was incorrectly executed instead of real download!"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -Fq "skill-doctor: verifying SHA-256 digest..."; then
            echo "FAILED: Real download path did not log SHA-256 verification!"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -Fq "skill-doctor: checksum OK"; then
            echo "FAILED: Expected 'skill-doctor: checksum OK' log line!"
            exit 1
          fi

      - name: Test npm global install and CLI binary execution
        run: |
          echo "Testing npm install -g @security.kalarislabs/skill-doctor@${VERSION}..."
          npm install -g "@security.kalarislabs/skill-doctor@${VERSION}"
          skill-doctor --version

          echo "Scanning benign example skill (expecting exit code 0)..."
          skill-doctor scan ./examples/hello-skill
          if [ $? -ne 0 ]; then
            echo "FAILED: Expected exit code 0 on benign fixture"
            exit 1
          fi

          echo "Scanning attack fixture SD-02 (expecting exit code 2)..."
          set +e
          skill-doctor scan ./tests/fixtures/attack/SD-02/malicious-skill --fail-on HIGH
          ATTACK_EXIT=$?
          set -e
          echo "Observed exit code on attack fixture: $ATTACK_EXIT"
          if [ $ATTACK_EXIT -ne 2 ]; then
            echo "FAILED: Expected exit code 2 on attack fixture, got $ATTACK_EXIT"
            exit 1
          fi
          echo "npm install verification PASSED"

      - name: Test crates.io install and CLI execution
        run: |
          echo "Testing cargo install skill-doctor --locked --features mcp..."
          cargo install skill-doctor --version "${VERSION}" --locked --features mcp --root ./cargo-test-install
          CARGO_BIN="./cargo-test-install/bin/skill-doctor"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            CARGO_BIN="./cargo-test-install/bin/skill-doctor.exe"
          fi

          "$CARGO_BIN" --version

          echo "Running crates.io binary on benign fixture..."
          "$CARGO_BIN" scan ./examples/hello-skill
          if [ $? -ne 0 ]; then
            echo "FAILED: Expected exit code 0 on benign fixture"
            exit 1
          fi

          echo "Running crates.io binary on attack fixture SD-02..."
          set +e
          "$CARGO_BIN" scan ./tests/fixtures/attack/SD-02/malicious-skill --fail-on HIGH
          CRATES_ATTACK_EXIT=$?
          set -e
          echo "Observed exit code: $CRATES_ATTACK_EXIT"
          if [ $CRATES_ATTACK_EXIT -ne 2 ]; then
            echo "FAILED: Expected exit code 2 on attack fixture from crates.io binary, got $CRATES_ATTACK_EXIT"
            exit 1
          fi
          echo "crates.io install verification PASSED"

      - name: Test Composite Action from published release tag
        uses: KalarisLabs/Skill-Doctor@v0.1.0
        with:
          path: ./examples/hello-skill
          mode: scan
          fail-on: HIGH
          output: sarif
          sarif-file: post-release-test.sarif

      - name: Verify SARIF output was generated
        run: |
          if [ ! -s post-release-test.sarif ]; then
            echo "FAILED: Expected post-release-test.sarif to be generated by action"
            exit 1
          fi
          echo "post-release-test.sarif verified successfully."
