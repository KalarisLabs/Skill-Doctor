name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tag-version-guard:
    name: tag-version-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify tag matches Cargo.toml and package.json
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VER=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          BASE_TAG="${TAG_VER%%-*}"
          echo "tag=$TAG_VER base=$BASE_TAG cargo=$CARGO_VER package.json=$PKG_VER"
          [ "$BASE_TAG" = "$CARGO_VER" ] || { echo "ERROR: base tag $BASE_TAG != Cargo.toml $CARGO_VER"; exit 1; }
          [ "$BASE_TAG" = "$PKG_VER" ]   || { echo "ERROR: base tag $BASE_TAG != package.json $PKG_VER"; exit 1; }

  build-release:
    name: Build Binary (${{ matrix.target }})
    needs: [tag-version-guard]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive_ext: tar.gz
            use_cross: true
          - os: macos-14
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            use_cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            use_cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive_ext: zip
            use_cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross (if required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary (including mcp feature)
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked -p skill-doctor --features mcp --target ${{ matrix.target }}
          else
            cargo build --release --locked -p skill-doctor --features mcp --target ${{ matrix.target }}
          fi

      - name: Package archive (flat layout)
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          TAG="${{ github.ref_name }}"
          PKG_NAME="skill-doctor-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"
          
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            cp "${BIN_DIR}/skill-doctor.exe" "dist/${PKG_NAME}/"
            cp LICENSE README.md "dist/${PKG_NAME}/"
            (cd "dist/${PKG_NAME}" && 7z a "../${PKG_NAME}.zip" *)
          else
            cp "${BIN_DIR}/skill-doctor" "dist/${PKG_NAME}/"
            cp LICENSE README.md "dist/${PKG_NAME}/"
            (cd "dist/${PKG_NAME}" && tar -czf "../${PKG_NAME}.tar.gz" *)
          fi
          ls -la dist/

      - name: Upload archive artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.${{ matrix.archive_ext }}
          retention-days: 1

  packaging-dry-run:
    name: packaging-dry-run
    needs: [tag-version-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - name: Assert clean working tree
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "ERROR: working tree is dirty before packaging verification"
            exit 1
          fi
      - name: Dry-run Packaging Verification
        run: |
          set -uo pipefail
          for c in skill-doctor-neutralize skill-doctor-rules skill-doctor-sandbox; do
            echo "== dry-run (must pass): $c"
            cargo publish --dry-run -p "$c"
          done
          for c in skill-doctor-core skill-doctor-mcp skill-doctor; do
            echo "== dry-run (advisory until deps are on crates.io): $c"
            out=$(cargo publish --dry-run -p "$c" 2>&1) || rc=$?
            echo "$out"
            if [ "${rc:-0}" -ne 0 ]; then
              if echo "$out" | grep -Fq "no matching package"; then
                echo "::warning::$c dry-run deferred: workspace dep not yet on crates.io for this version"
              else
                echo "ERROR: $c dry-run failed for a real reason"
                exit 1
              fi
            fi
            unset rc
          done
          npm pack --dry-run

  provenance-and-release:
    name: Provenance, SBOM, Attestation & Release
    needs: [build-release, packaging-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Setup Node.js (for npm dry-run)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Setup Cosign for Sigstore keyless signing
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.8.0

      - name: Prepare release assets directory
        run: mkdir -p release-assets

      - name: Download all binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: binary-*
          merge-multiple: true

      - name: List downloaded binary archives
        run: ls -la release-assets/

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum skill-doctor-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign SHA256SUMS.txt with Sigstore Cosign (OIDC Keyless)
        working-directory: release-assets
        run: |
          cosign sign-blob \
            --yes \
            --bundle SHA256SUMS.txt.bundle \
            SHA256SUMS.txt

      - name: Generate CycloneDX SBOM (including mcp feature)
        run: |
          cargo install cargo-cyclonedx
          cargo cyclonedx --manifest-path crates/skill-doctor-cli/Cargo.toml --format json --features mcp
          mkdir -p release-assets
          # Copy generated SBOM to release assets
          if [ -f "crates/skill-doctor-cli/skill-doctor.cdx.json" ]; then
            cp crates/skill-doctor-cli/skill-doctor.cdx.json release-assets/skill-doctor.cdx.json
          elif [ -f "crates/skill-doctor-cli/bom.json" ]; then
            cp crates/skill-doctor-cli/bom.json release-assets/skill-doctor.cdx.json
          elif [ -f "skill-doctor.cdx.json" ]; then
            cp skill-doctor.cdx.json release-assets/skill-doctor.cdx.json
          else
            find . -name "*.cdx.json" -o -name "bom.json" | while read -r f; do
              cp "$f" release-assets/skill-doctor.cdx.json
              break
            done
          fi
          test -f release-assets/skill-doctor.cdx.json || { echo "ERROR: skill-doctor.cdx.json not found"; exit 1; }
          # Clean up any intermediate SBOM artifacts from crate directories
          rm -f crates/*/*.cdx.json crates/*/bom.json
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "ERROR: working tree is dirty after SBOM generation"
            exit 1
          fi
          ls -la release-assets/

      - name: Create GitHub Release with Provenance Assets (Draft)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
