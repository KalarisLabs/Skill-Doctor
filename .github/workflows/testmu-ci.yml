name: MuLamBDA E2E Testing Pipeline

on:
  push:
    branches: [ "main", "feature/mulambda-testing-pipeline" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  testmu-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Skill Doctor
        run: cargo build --release

      - name: Run Corpus Generation (Test Pipeline)
        run: |
          chmod +x ./tests/run_tests.sh
          ./tests/run_tests.sh

      - name: Setup Node.js (for Kane CLI)
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli


      - name: Execute E2E Validation on HTML Reports
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          # AI validation via Kane CLI for SD-01
          kane-cli run "Open file://$(pwd)/tests/results/report_sd01.html. Verify that the 'SD-01 Prompt Injection' vulnerability is displayed in the report summary."

          # AI validation via Kane CLI for SD-02
          kane-cli run "Open file://$(pwd)/tests/results/report_sd02.html. Verify that the 'SD-02 Command Injection' vulnerability is highlighted."

          # AI validation via Kane CLI for SD-03
          kane-cli run "Open file://$(pwd)/tests/results/report_sd03.html. Verify that the 'SD-03 Data Exfiltration' vulnerability is detected."

      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        with:
          name: mulambda-test-results
          path: tests/results/
