[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/report",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
authors = ["Kalaris Labs <sayan@kalarislabs.com>"]
repository = "https://github.com/KalarisLabs/Skill-Doctor"
description = "Multi-layer security platform for AI agent skill files"
keywords = ["security", "ai", "agent", "skill", "scanner", "yara"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Scanning
yara-x = "1.19"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"

# Sandbox
microsandbox = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Async
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Archive handling
zip = "2"
tar = "0.4"
flate2 = "1"

# Crypto
sha2 = "0.10"
hex = "0.4"

# UUID
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# TUI
opentui_rust = "0.2"
indicatif = "0.17"
console = "0.15"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Regex
regex = "1"

# Temp files
tempfile = "3"

# File walking
walkdir = "2"

# URL parsing
url = "2"

# Embed YARA rules at compile time
rust-embed = { version = "8", features = ["include-exclude"] }
