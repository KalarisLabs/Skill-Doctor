[workspace]
resolver = "2"
members = [
    "crates/skill-doctor-cli",
    "crates/skill-doctor-core",
    "crates/skill-doctor-rules",
    "crates/skill-doctor-neutralize",
    "crates/skill-doctor-mcp",
    "crates/skill-doctor-sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93.0"
license = "Apache-2.0"
repository = "https://github.com/kalarislabs/skill-doctor"
authors = ["Kalaris Labs <sayan@kalarislabs.com>"]

[workspace.dependencies]
# analysis engines — milestone 1
regex = "1"
memchr = "2"
bstr = "1"
base64 = "0.23"
hex = "0.4"

# intake / hashing / io
sha2 = "0.11"
walkdir = "2"

# concurrency / errors
rayon = "1"
anyhow = "1"
thiserror = "2"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# cli
clap = { version = "4.5", features = ["derive"] }

# benchmarks
criterion = "0.8"

# unicode & analysis — milestone 2
unicode-normalization = "0.1"
unicode-security = "0.1"
serde_yaml = "0.9"

# archives & intake — milestone 2
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

# cli presentation & ux — layer a, b, c
anstream = "1.0"
anstyle = "1.0"
is-terminal = "0.4"
indicatif = "0.18"
notify = "8.2"

# opt-in tui (feature gated)
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false }

# rules engine
yara-x = { version = "1.20", default-features = false, features = ["constant-folding"] }
# tree-sitter = "0.24"
# tree-sitter-bash = "0.23"
# tree-sitter-python = "0.23"
# tree-sitter-javascript = "0.23"
# tree-sitter-json = "0.24"
# memmap2 = "0.9"
# blake3 = "1"
# ignore = "0.4"
# redb = "2"
# tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
# once_cell = "1"
# rand = "0.8"
# serde-sarif = "0.7"
# is-terminal = "0.4"
# anstream = "0.6"
# owo-colors = "4"
# codespan-reporting = "0.11"
# ratatui = "0.28"
# crossterm = "0.28"
# rmcp = "0.1"
# schemars = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }

# sigstore = "0.10"
# nix = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
