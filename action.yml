name: 'Skill Doctor Scan'
description: 'Scan AI agent skill files for malicious payloads, prompt injections, and supply-chain vulnerabilities.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target:
    description: 'Path to the skill directory, file, or repository to scan'
    required: false
    default: '.'
  fail-on:
    description: 'Minimum severity level to fail the build (CRITICAL, HIGH, MEDIUM, LOW)'
    required: false
    default: 'HIGH'
  rule_pack:
    description: 'Comma-separated list of rule packs to use (core, supply_chain, etc.)'
    required: false
    default: 'core'
  args:
    description: 'Additional arguments to pass to skill-doctor scan'
    required: false
    default: ''
  version:
    description: 'Version of Skill Doctor to install'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Download Skill Doctor
      shell: bash
      run: |
        echo "Installing Skill Doctor..."
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          DOWNLOAD_URL="https://github.com/KalarisLabs/Skill-Doctor/releases/latest/download/skill-doctor-linux-amd64"
          SHA256_URL="https://github.com/KalarisLabs/Skill-Doctor/releases/latest/download/skill-doctor-linux-amd64.sha256"
        else
          DOWNLOAD_URL="https://github.com/KalarisLabs/Skill-Doctor/releases/download/${VERSION}/skill-doctor-linux-amd64"
          SHA256_URL="https://github.com/KalarisLabs/Skill-Doctor/releases/download/${VERSION}/skill-doctor-linux-amd64.sha256"
        fi
        
        curl -fsSL -o skill-doctor "$DOWNLOAD_URL"
        curl -fsSL -o skill-doctor.sha256 "$SHA256_URL"
        
        # Verify checksum
        sha256sum -c skill-doctor.sha256
        
        chmod +x skill-doctor
        sudo mv skill-doctor /usr/local/bin/

    - name: Run Skill Doctor Scan
      shell: bash
      run: |
        skill-doctor scan "${{ inputs.target }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --rule-pack "${{ inputs.rule_pack }}" \
          ${{ inputs.args }}
