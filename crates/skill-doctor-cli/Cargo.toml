[package]
name = "skill-doctor"
description = "Security scanner for AI agent skill files — CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "skill-doctor"
path = "src/main.rs"

[dependencies]
skill-doctor-core = { path = "../skill-doctor-core" }
skill-doctor-rules = { path = "../skill-doctor-rules" }
skill-doctor-neutralize = { path = "../skill-doctor-neutralize" }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
walkdir = { workspace = true }
anstream = { workspace = true }
anstyle = { workspace = true }
is-terminal = { workspace = true }
indicatif = { workspace = true }
notify = { workspace = true }

# Layer C TUI dependencies (opt-in feature)
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

# MCP server dependencies (opt-in feature)
skill-doctor-mcp = { path = "../skill-doctor-mcp", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std"], optional = true }

[features]
default = []
tui = ["dep:ratatui", "dep:crossterm"]
mcp = ["dep:skill-doctor-mcp", "dep:tokio"]
