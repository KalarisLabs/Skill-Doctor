[package]
name = "skill-doctor-mcp"
description = "MCP (Model Context Protocol) server for Skill Doctor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rmcp = { version = "3.2", default-features = false, features = ["server", "transport-io", "schemars", "macros"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
skill-doctor-core = { path = "../skill-doctor-core" }
skill-doctor-neutralize = { path = "../skill-doctor-neutralize" }
anyhow = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
