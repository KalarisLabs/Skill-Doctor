# cargo-deny configuration for Skill Doctor
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[advisories]
ignore = [
    # Bincode 2.0.1 unmaintained advisory (transitive dependency of yara-x 1.20.0).
    "RUSTSEC-2025-0141",
    # Wasmtime 45.0.3 WASI filesystem vulnerabilities (GHSA-hgjw-h833-99q9 & GHSA-vqjp-4c8c-hfgg).
    # skill-doctor-rules uses yara-x with in-memory Cranelift runtime only;
    # WASI filesystem APIs are neither compiled nor exposed.
    "RUSTSEC-2026-0222",
    "RUSTSEC-2026-0269",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
