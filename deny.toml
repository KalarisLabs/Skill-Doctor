[advisories]
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
ignore = []

[licenses]
unlicensed = "deny"
copyleft = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    "MPL-2.0"
]
deny = [
    "GPL-1.0",
    "GPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
