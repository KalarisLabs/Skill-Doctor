[advisories]
unmaintained = "all"
ignore = [
    "RUSTSEC-2023-0071", # No fixed upgrade available for RSA Marvin attack
    "RUSTSEC-2026-0222", # wasmtime vulnerability pending upstream yara-x patch
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0"
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
