[advisories]
unmaintained = "all"
ignore = [
    "RUSTSEC-2023-0071", # No fixed upgrade available for RSA Marvin attack
    "RUSTSEC-2026-0222", # wasmtime vulnerability pending upstream yara-x patch
    "RUSTSEC-2025-0141", # bincode is unmaintained (transitive via yara-x)
    "RUSTSEC-2021-0141", # dotenv is unmaintained (transitive via microsandbox)
    "RUSTSEC-2025-0119", # number_prefix is unmaintained (transitive via indicatif)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0"
]

[[licenses.exceptions]]
name = "unicode-ident"
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
